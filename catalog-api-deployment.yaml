apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api-deployment
  namespace: fcg

spec:
  replicas: 1

  selector:
    matchLabels:
      app: catalog-api

  template:
    metadata:
      labels:
        app: catalog-api

    spec:
      containers:
        - name: catalog-api
          image: catalog-api:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:

            # =========================================
            # CONFIG MAP
            # =========================================
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: RabbitMQ__Host

            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: RabbitMQ__Port

            - name: RabbitMQ__Queues__FGC
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: RabbitMQ__Queues__FGC            

            # =========================================
            # SECRET
            # =========================================
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secret
                  key: ConnectionStrings__DefaultConnection

            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secret
                  key: RabbitMQ__Username

            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secret
                  key: RabbitMQ__Password