apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fcg
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.fcg.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboard-provisioning.yml: |
    apiVersion: 1
    providers:
      - name: fcg-dashboards
        orgId: 1
        folder: "FCG"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
