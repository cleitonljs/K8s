name: fgc

services:
  mysql:
    container_name: mysql

    image: mysql:8.4

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: fcgdb

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - app-network

  rabbitmq:
    container_name: rabbitmq
    
    image: rabbitmq:4.3.1-management
    
    ports:
      - "5672:5672"   # Porta AMQP
      - "15672:15672" # Painel web
    
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    networks:
      - app-network

  users-api:
    container_name: users-api

    build:
      context: ../../UsersAPI
      dockerfile: Dockerfile
      
    image: users-api:latest

    restart: always

    environment:
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=fcgdb;user=root;password=root123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__Queues__FCG_User: FCG-queue-user

    ports:
      - "8010:8080"

    depends_on:
      - mysql

    networks:
      - app-network
  
  notifications-api:
    container_name: notifications-api
      
    build: 
      context: ../../NotificationsAPI
      dockerfile: Dockerfile
      
    image: notifications-api:latest

    restart: always

    environment:
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=fcgdb;user=root;password=root123"
      
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      
      RabbitMQ__Queues__FCG_User: FCG-queue-user      
      RabbitMQ__Queues__FCG_Notification: FGC-queue-notification
      
      API_Users__URL: http://users-api:8080
      API_Users__Email: admin@email.com
      API_Users__Senha: 1234@Abc
      
      URL_API_Catalog: http://catalog-api:8080 

    ports:
      - "8020:8080"

    networks:
      - app-network

    depends_on:
      - rabbitmq

  catalog-api:
    container_name: catalog-api
  
    build: 
      context: ../../CatalogAPI
      dockerfile: Dockerfile
      
    image: catalog-api:latest

    restart: always

    environment:
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=fcgdb;user=root;password=root123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      
      RabbitMQ__Queues__FCG_Catalog: FGC-queue-catalog
      RabbitMQ__Queues__FCG_Payment: FGC-queue-payment

    ports:
      - "8030:8080"

    depends_on:
      - mysql

    networks:
      - app-network

  payments-api:
    container_name: payments-api
    
    build: 
      context: ../../PaymentsAPI
      dockerfile: Dockerfile
      
    image: payments-api:latest
    
    restart: always

    ports:
      - "8040:8080"

    environment:
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=fcgdb;user=root;password=root123"
      
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      
      RabbitMQ__Queues__FCG_Catalog: FGC-queue-catalog
      RabbitMQ__Queues__FCG_Payment: FGC-queue-payment
      RabbitMQ__Queues__FCG_Notification: FGC-queue-notification

    networks:
      - app-network

  prometheus:
    container_name: prometheus

    image: prom/prometheus:v2.55.1

    restart: always

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - catalog-api
      - users-api

    networks:
      - app-network

  grafana:
    container_name: grafana

    image: grafana/grafana:11.3.1

    restart: always

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123

    volumes:
      - ./grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning/dashboards/dashboard-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboard-provisioning.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

    networks:
      - app-network

volumes:
  mysql_data:
  prometheus_data:

networks:
 app-network:
   driver: bridge